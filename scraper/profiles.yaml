# Research profiles — one shared database of positions, ranked differently per profile.
#
# A profile never changes what is collected or how it is tagged; it only changes the
# ranking. The site has a profile picker; ?p=<id> in the address opens a profile
# directly, and the "Tune" panel lets you adjust a copy of any profile in the browser.
# The formula is documented at the top of scraper/profiles.py and mirrored in
# docs/score.js (tests/test_profiles.py checks that both give identical scores).
#
# Keys
#   label, blurb   shown in the picker
#   interests      taxonomy node -> weight 0-100, or a level name below. A node is a field
#                  (micro, drug, immuno, molbio, genomics, biotech, health, org, ops, life)
#                  or a sub-field (micro.amr, ...; see scraper/taxonomy.py). The MOST SPECIFIC
#                  node listed wins. A position with no positively weighted topic scores 0.
#   cross_field    share of the best weight from a second field that is added
#   kinds          bonus by position type: phd, internship, fellowship, technician, scientist, other,
#                  postdoc, faculty (postdoc and faculty posts are dropped by scraper/site.yaml anyway)
#   sectors        bonus by sector: academic, industry, ai-bio, public-health, nonprofit
#   labs           bonus by lab type: wet, hybrid, dry, unknown
#   regions        bonus by region: europe, india, north-america, asia-pacific, middle-east,
#                  africa, latin-america, remote, unknown
#   coding         added when the role needs substantial programming (usually negative)
#   senior         added for senior roles (5+ years post-PhD, principal, director ...)
#   needs_phd      added when a job (not a PhD position) asks for a PhD and does not accept an MSc
#   visa           bonus by visa line: sponsors, no-sponsorship, unknown
#   cv             points for a perfect match with the CV text in scraper/cv/<id>.txt (0-1 scaled)
#   llm            +/- points from the optional Claude fit check (needs ANTHROPIC_API_KEY)
#   network        organisation/location pattern -> bonus (lower-case, accents removed; first match counts)
#   network_label  how that bonus is named on the cards
#   search         terms and places used by the "Search elsewhere" tab (LinkedIn, Google Jobs ...)
#
# Level names: top 100 · very_high 85 · high 70 · medium 45 · low 20 · none 0 · avoid -40

